<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026학년도 유치원 주간업무 & 월중행사 취합 시스템</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    @media print {
      body { background-color: #ffffff !important; font-size: 10px !important; }
      .no-print { display: none !important; }
      .print-only { display: block !important; }
      @page {
        size: A4 landscape;
        margin: 8mm 6mm;
      }
      table { border-collapse: collapse !important; width: 100% !important; }
      th, td { border: 1px solid #4b5563 !important; }
      .cal-cell { min-height: 68px !important; }

      .print-page-break {
        page-break-after: always !important;
        break-after: page !important;
      }
      .print-avoid-break {
        page-break-inside: avoid !important;
        break-inside: avoid !important;
      }
    }
    .print-only { display: none; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col">

  <!-- 헤더 (네비게이션 & 주요 액션) -->
  <header class="bg-indigo-900 text-white shadow-md no-print sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-3">
      <div class="flex items-center space-x-3">
        <div class="w-9 h-9 rounded-lg bg-indigo-700 flex items-center justify-center text-yellow-300">
          <i class="fa-solid fa-shapes text-lg"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold tracking-tight">유치원 교육활동 & 월중행사 취합 시스템</h1>
          <p class="text-xs text-indigo-300">2026학년도 주간·월간 학사일정 아카이브</p>
        </div>
      </div>

      <!-- 탭 버튼 -->
      <nav class="flex space-x-1 bg-indigo-950/60 p-1 rounded-lg">
        <button type="button" onclick="switchTab('weekly')" id="tab-btn-weekly" class="cursor-pointer px-4 py-1.5 text-xs font-semibold rounded-md transition-all bg-indigo-600 text-white shadow">
          <i class="fa-solid fa-table-list mr-1.5"></i>주간업무
        </button>
        <button type="button" onclick="switchTab('monthly')" id="tab-btn-monthly" class="cursor-pointer px-4 py-1.5 text-xs font-semibold rounded-md transition-all text-indigo-200 hover:text-white">
          <i class="fa-regular fa-calendar-days mr-1.5"></i>월중행사 (달력)
        </button>
      </nav>

      <!-- 우측 액션 버튼 -->
      <div class="flex items-center space-x-2">
        <button type="button" onclick="openCreateModal()" class="cursor-pointer px-3.5 py-1.5 text-xs font-bold bg-emerald-600 hover:bg-emerald-500 text-white rounded-md flex items-center shadow transition-colors">
          <i class="fa-solid fa-plus mr-1.5"></i>일정 등록
        </button>
        <button type="button" onclick="window.print()" class="cursor-pointer px-3 py-1.5 text-xs font-semibold bg-slate-700 hover:bg-slate-600 text-white rounded-md flex items-center shadow transition-colors">
          <i class="fa-solid fa-print mr-1.5"></i>인쇄(A4)
        </button>
      </div>
    </div>
  </header>

  <!-- 인쇄 전용 머리글 -->
  <div class="print-only mb-2 text-center">
    <h2 class="text-lg font-bold text-gray-900 tracking-wide" id="print-title">2026학년도 유치원 교육계획안</h2>
    <p class="text-[9px] text-gray-500 mt-0.5" id="print-date"></p>
  </div>

  <!-- 인쇄 전용 공지사항 영역 -->
  <div id="print-notice-box" class="print-only mb-2 border border-slate-400 rounded p-2 bg-slate-50 text-[10px]">
    <div class="font-bold text-slate-800 mb-0.5"><i class="fa-solid fa-bullhorn mr-1"></i>[주요 공지 및 전달사항]</div>
    <div id="print-notice-list" class="space-y-0.5 pl-2"></div>
  </div>

  <!-- 메인 영역 -->
  <main class="max-w-7xl mx-auto px-4 py-4 flex-1 w-full">
    
    <!-- 필터 및 날짜 이동 컨트롤러 -->
    <div class="no-print bg-white p-3.5 rounded-xl shadow-sm border border-slate-200 mb-3 flex flex-wrap items-center justify-between gap-4">
      <div class="flex flex-wrap items-center gap-3">
        <div>
          <label class="block text-[11px] font-bold text-slate-500 mb-1">대상 학급</label>
          <select id="filter-target" onchange="renderCurrentView()" class="border border-slate-300 rounded-lg px-2.5 py-1.5 text-xs font-medium focus:ring-2 focus:ring-indigo-500 bg-slate-50">
            <option value="ALL">전체 학급</option>
            <option value="만 3세">만 3세</option>
            <option value="만 4세">만 4세</option>
            <option value="만 5세">만 5세</option>
            <option value="특수학급">특수학급</option>
            <option value="전원">전체 공통</option>
          </select>
        </div>

        <div>
          <label class="block text-[11px] font-bold text-slate-500 mb-1">업무/행사 구분</label>
          <select id="filter-category" onchange="renderCurrentView()" class="border border-slate-300 rounded-lg px-2.5 py-1.5 text-xs font-medium focus:ring-2 focus:ring-indigo-500 bg-slate-50">
            <option value="ALL">전체 구분</option>
            <option value="교육활동">교육활동</option>
            <option value="교무">교무</option>
            <option value="연구">연구</option>
            <option value="정보(학비)">정보(학비)</option>
            <option value="안전">안전</option>
            <option value="특수">특수</option>
            <option value="방과후">방과후</option>
            <option value="복무 및 출장">복무 및 출장</option>
          </select>
        </div>
      </div>

      <!-- 날짜 이동 컨트롤 & 오늘 버튼 -->
      <div class="flex items-center space-x-2">
        <button type="button" onclick="goToToday()" class="cursor-pointer px-2.5 py-1.5 border border-indigo-200 bg-indigo-50 hover:bg-indigo-100 text-xs font-bold text-indigo-700 rounded-lg transition-colors">
          오늘
        </button>
        <button type="button" onclick="navigateDate(-1)" class="cursor-pointer px-2.5 py-1.5 border border-slate-300 rounded-lg hover:bg-slate-50 text-xs text-slate-700">
          <i class="fa-solid fa-chevron-left"></i>
        </button>
        <span id="current-range-label" class="text-sm font-bold text-slate-800 px-2 min-w-[200px] text-center select-none">
          -
        </span>
        <button type="button" onclick="navigateDate(1)" class="cursor-pointer px-2.5 py-1.5 border border-slate-300 rounded-lg hover:bg-slate-50 text-xs text-slate-700">
          <i class="fa-solid fa-chevron-right"></i>
        </button>
      </div>
    </div>

    <!-- 공통 공지사항 바 -->
    <div class="no-print bg-amber-50/95 border border-amber-200 rounded-xl px-4 py-2.5 mb-4 shadow-xs">
      <div class="flex flex-wrap items-center justify-between gap-2 mb-1.5">
        <div class="flex items-center space-x-2">
          <span class="w-5 h-5 rounded bg-amber-200 text-amber-800 flex items-center justify-center text-xs">
            <i class="fa-solid fa-bullhorn"></i>
          </span>
          <span class="text-xs font-bold text-amber-950">공통 공지 및 전달사항</span>
          <span id="notice-filter-status" class="text-[10px] font-semibold text-amber-800/80 bg-amber-200/60 px-1.5 py-0.5 rounded">
            현재 기간 기준
          </span>
        </div>

        <div class="flex items-center space-x-1.5">
          <button type="button" id="btn-toggle-notice-view" onclick="toggleNoticeFilter()" class="cursor-pointer px-2 py-0.5 text-[10px] font-bold bg-white hover:bg-amber-100 text-amber-900 border border-amber-300 rounded transition-colors">
            전체 공지 보기
          </button>
          <button type="button" onclick="openNoticeModal()" class="cursor-pointer px-2.5 py-1 text-[11px] font-bold bg-amber-600 hover:bg-amber-700 text-white rounded-lg shadow-xs transition-colors flex items-center">
            <i class="fa-solid fa-plus mr-1"></i>공지 추가
          </button>
        </div>
      </div>
      <div id="notice-list-container" class="space-y-1.5 pt-1 border-t border-amber-200/70">
        <!-- JS로 동적 렌더링 -->
      </div>
    </div>

    <!-- 1. 주간 업무 화면 (칸 클릭 시 등록 창 연동) -->
    <div id="view-weekly" class="space-y-4">
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse" id="weekly-table">
            <thead>
              <tr class="bg-slate-100/90 text-slate-700 text-xs font-bold border-b border-slate-200 text-center">
                <th class="py-2 px-2.5 w-24 border-r">구분</th>
                <th class="py-2 px-2 border-r w-1/5" id="th-day-1">월</th>
                <th class="py-2 px-2 border-r w-1/5" id="th-day-2">화</th>
                <th class="py-2 px-2 border-r w-1/5" id="th-day-3">수</th>
                <th class="py-2 px-2 border-r w-1/5" id="th-day-4">목</th>
                <th class="py-2 px-2 w-1/5" id="th-day-5">금</th>
              </tr>
            </thead>
            <tbody id="weekly-tbody" class="text-xs divide-y divide-slate-200">
              <!-- 주간 업무 표 렌더링 -->
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- 2. 월중 행사 화면 -->
    <div id="view-monthly" class="hidden space-y-5">
      <!-- 1페이지용 월간 달력 그리드 -->
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 print-page-break">
        <div class="grid grid-cols-7 border-b border-slate-200 pb-2 text-center text-xs font-bold text-slate-600 mb-1">
          <div class="text-rose-500">일</div>
          <div>월</div>
          <div>화</div>
          <div>수</div>
          <div>목</div>
          <div>금</div>
          <div class="text-blue-500">토</div>
        </div>
        <div id="calendar-grid" class="grid grid-cols-7 gap-px bg-slate-200 border border-slate-200 rounded overflow-hidden">
          <!-- 달력 일자별 셀 렌더링 -->
        </div>
      </div>

      <!-- 2페이지용 월간 세부 목록 테이블 -->
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 print-avoid-break">
        <div class="print-only mb-2 text-center">
          <h3 class="text-base font-bold text-gray-900" id="print-sub-title">월중 세부 학사일정 및 업무 목록</h3>
        </div>
        <h3 class="text-xs font-bold text-slate-800 mb-3 flex items-center justify-between no-print">
          <span><i class="fa-solid fa-list-check text-indigo-600 mr-1.5"></i>해당 월 등록된 전체 학사일정 (세부내용)</span>
          <span class="text-xs font-semibold text-slate-500" id="total-count-label">총 0건</span>
        </h3>
        <div class="overflow-x-auto">
          <table class="w-full text-xs text-left border-collapse border border-slate-200">
            <thead class="bg-slate-100 text-slate-700 font-bold border-b border-slate-200">
              <tr>
                <th class="py-2 px-3 border-r w-24 text-center">날짜</th>
                <th class="py-2 px-3 border-r w-20 text-center">대상</th>
                <th class="py-2 px-3 border-r w-28 text-center">구분</th>
                <th class="py-2 px-3 border-r">행사 및 업무 내용 (클릭 시 수정)</th>
                <th class="py-2 px-3 border-r w-24 text-center">담당자</th>
                <th class="py-2 px-3 w-16 text-center no-print">삭제</th>
              </tr>
            </thead>
            <tbody id="monthly-tbody" class="divide-y divide-slate-200">
              <!-- 월간 목록 렌더링 -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <!-- 공지사항 등록 모달 -->
  <div id="notice-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center no-print">
    <div class="bg-white rounded-xl shadow-2xl w-full max-w-md mx-4 overflow-hidden border border-slate-100">
      <div class="bg-amber-600 px-5 py-3.5 flex justify-between items-center text-white">
        <h3 class="font-bold text-sm flex items-center"><i class="fa-solid fa-bullhorn mr-2"></i>공통 공지사항 작성</h3>
        <button type="button" onclick="closeNoticeModal()" class="cursor-pointer text-amber-100 hover:text-white text-xl font-bold px-1 leading-none">&times;</button>
      </div>

      <form id="notice-form" onsubmit="saveNotice(event)" class="p-5 space-y-3.5 text-xs">
        <div>
          <label class="block font-bold text-slate-700 mb-1">작성자 / 부서 *</label>
          <input type="text" id="notice-author-input" required placeholder="예: 원무실, 연구부, 안전담당" class="w-full border border-slate-300 rounded-md px-2.5 py-1.5 focus:ring-2 focus:ring-amber-500 bg-white">
        </div>

        <div class="grid grid-cols-2 gap-3 bg-amber-50/50 p-2.5 rounded-lg border border-amber-200/60">
          <div>
            <label class="block font-bold text-slate-700 mb-1">게시 시작일 *</label>
            <input type="date" id="notice-start-date" required class="w-full border border-slate-300 rounded-md px-2 py-1.5 bg-white text-xs">
          </div>
          <div>
            <label class="block font-bold text-slate-700 mb-1">게시 종료일 *</label>
            <input type="date" id="notice-end-date" required class="w-full border border-slate-300 rounded-md px-2 py-1.5 bg-white text-xs">
          </div>
          <div class="col-span-2 text-[10px] text-slate-500">
            ※ 설정한 기간에 해당하는 주간 및 월간 화면에만 공지가 자동으로 표시됩니다.
          </div>
        </div>

        <div>
          <label class="block font-bold text-slate-700 mb-1">공지 및 전달 내용 *</label>
          <textarea id="notice-content-input" required rows="3" placeholder="주간 및 월간 계획에 공통으로 전달할 중요한 공지사항을 입력하세요." class="w-full border border-slate-300 rounded-md px-2.5 py-1.5 focus:ring-2 focus:ring-amber-500 bg-white"></textarea>
        </div>

        <div class="pt-3 border-t flex justify-end space-x-2">
          <button type="button" onclick="closeNoticeModal()" class="cursor-pointer px-3.5 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-md">취소</button>
          <button type="submit" class="cursor-pointer px-4 py-1.5 bg-amber-600 hover:bg-amber-700 text-white font-bold rounded-md shadow">등록하기</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 일정 등록 및 수정 모달 -->
  <div id="schedule-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center no-print">
    <div class="bg-white rounded-xl shadow-2xl w-full max-w-lg mx-4 overflow-hidden border border-slate-100">
      <div id="modal-header-bg" class="bg-indigo-900 px-5 py-3.5 flex justify-between items-center text-white">
        <h3 id="modal-title" class="font-bold text-sm flex items-center"><i class="fa-solid fa-calendar-plus mr-2 text-yellow-300"></i>새 일정 등록</h3>
        <button type="button" onclick="closeModal()" class="cursor-pointer text-indigo-200 hover:text-white text-xl font-bold px-1 leading-none">&times;</button>
      </div>

      <form id="schedule-form" onsubmit="handleScheduleFormSubmit(event)" class="p-5 space-y-3.5 text-xs">
        <input type="hidden" id="form-edit-id" value="">

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block font-bold text-slate-700 mb-1">날짜 *</label>
            <input type="date" id="form-date" required class="w-full border border-slate-300 rounded-md px-2.5 py-1.5 focus:ring-2 focus:ring-indigo-500 bg-white">
          </div>
          <div>
            <label class="block font-bold text-slate-700 mb-1">대상 학급 *</label>
            <select id="form-target" class="w-full border border-slate-300 rounded-md px-2.5 py-1.5 bg-white">
              <option value="전원">전체 공통</option>
              <option value="만 3세">만 3세</option>
              <option value="만 4세">만 4세</option>
              <option value="만 5세">만 5세</option>
              <option value="특수학급">특수학급</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block font-bold text-slate-700 mb-1">업무/행사 구분 *</label>
            <select id="form-category" class="w-full border border-slate-300 rounded-md px-2.5 py-1.5 bg-white">
              <option value="교육활동">교육활동</option>
              <option value="교무">교무</option>
              <option value="연구">연구</option>
              <option value="정보(학비)">정보(학비)</option>
              <option value="안전">안전</option>
              <option value="특수">특수</option>
              <option value="방과후">방과후</option>
              <option value="복무 및 출장">복무 및 출장</option>
            </select>
          </div>
          <div>
            <label class="block font-bold text-slate-700 mb-1">담당 교사</label>
            <input type="text" id="form-owner" placeholder="예: 연구교사, 담당자" class="w-full border border-slate-300 rounded-md px-2.5 py-1.5">
          </div>
        </div>

        <div>
          <label class="block font-bold text-slate-700 mb-1">행사/업무명 *</label>
          <input type="text" id="form-title" required placeholder="예: 2학기 현장체험학습 계획 수립" class="w-full border border-slate-300 rounded-md px-2.5 py-1.5">
        </div>

        <div>
          <label class="block font-bold text-slate-700 mb-1">상세 내용 및 협조 사항</label>
          <textarea id="form-desc" rows="3" placeholder="시간, 장소, 준비물 및 학급별 협조사항을 적어주세요." class="w-full border border-slate-300 rounded-md px-2.5 py-1.5"></textarea>
        </div>

        <div class="pt-3 border-t flex justify-between items-center">
          <div>
            <button type="button" id="btn-modal-delete" onclick="handleModalDelete()" class="hidden cursor-pointer px-3 py-1.5 bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold rounded-md transition-colors">
              <i class="fa-regular fa-trash-can mr-1"></i>삭제
            </button>
          </div>
          <div class="flex space-x-2">
            <button type="button" onclick="closeModal()" class="cursor-pointer px-3.5 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-md">취소</button>
            <button type="submit" id="btn-modal-submit" class="cursor-pointer px-4 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-md shadow">저장하기</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- 자바스크립트 전체 로직 -->
  <script>
    // '교육행사' -> '교육활동'으로 변경
    const CATEGORIES = [
      '교육활동',
      '교무',
      '연구',
      '정보(학비)',
      '안전',
      '특수',
      '방과후',
      '복무 및 출장'
    ];

    // 데이터셋 내 모든 '교육행사'를 '교육활동'으로 일괄 적용
    const excelSchedules = [

      schedules = excelSchedules;

    // 혹시라도 남아있는 '교육행사'가 있다면 즉시 '교육활동'으로 안전 보정
    schedules = schedules.map(item => item.category === '교육행사' ? { ...item, category: '교육활동' } : item);

    const initialNoticeList = [
      {
        id: "n1",
        author: "원무실",
        content: "2026학년도 1학기 신학기 유아 적응지도 및 학사일정을 확인해 주시기 바랍니다.",
        startDate: "2026-03-01",
        endDate: "2026-03-31"
      }
    ];

    let notices = [];
    try {
      const storedNotices = localStorage.getItem('kg_notices_list_v2');
      notices = storedNotices ? JSON.parse(storedNotices) : initialNoticeList;
      if (!Array.isArray(notices) || notices.length === 0) notices = initialNoticeList;
    } catch(e) {
      notices = initialNoticeList;
    }

    let showAllNotices = false;
    let currentTab = 'weekly';
    
    function formatDate(d) {
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function getMonday(dateObj) {
      const d = new Date(dateObj.getFullYear(), dateObj.getMonth(), dateObj.getDate());
      const day = d.getDay();
      const diff = d.getDate() - day + (day === 0 ? -6 : 1);
      return new Date(d.setDate(diff));
    }

    const today = new Date();
    let currentMonday = getMonday(today);
    let currentCalMonth = new Date(today.getFullYear(), today.getMonth(), 1);

    function goToToday() {
      const now = new Date();
      currentMonday = getMonday(now);
      currentCalMonth = new Date(now.getFullYear(), now.getMonth(), 1);
      renderCurrentView();
    }

    function saveToStorage() {
      try {
        localStorage.setItem('kg_schedules', JSON.stringify(schedules));
      } catch(e) {
        console.warn('LocalStorage 저장 실패:', e);
      }
      renderCurrentView();
    }

    function toggleNoticeFilter() {
      showAllNotices = !showAllNotices;
      const btn = document.getElementById('btn-toggle-notice-view');
      const statusBadge = document.getElementById('notice-filter-status');

      if (showAllNotices) {
        btn.textContent = "현재 기간만 보기";
        statusBadge.textContent = "전체 공지 표시 중";
        statusBadge.className = "text-[10px] font-bold text-indigo-800 bg-indigo-100 px-1.5 py-0.5 rounded";
      } else {
        btn.textContent = "전체 공지 보기";
        statusBadge.textContent = "현재 기간 기준";
        statusBadge.className = "text-[10px] font-semibold text-amber-800/80 bg-amber-200/60 px-1.5 py-0.5 rounded";
      }
      renderNotices();
    }

    function isNoticeVisibleForCurrentView(n) {
      if (showAllNotices) return true;
      if (!n.startDate || !n.endDate) return true;

      if (currentTab === 'weekly') {
        const monStr = formatDate(currentMonday);
        const fri = new Date(currentMonday);
        fri.setDate(currentMonday.getDate() + 4);
        const friStr = formatDate(fri);
        return !(n.endDate < monStr || n.startDate > friStr);
      } else {
        const y = currentCalMonth.getFullYear();
        const m = currentCalMonth.getMonth();
        const monthStart = `${y}-${String(m + 1).padStart(2, '0')}-01`;
        const lastDay = new Date(y, m + 1, 0).getDate();
        const monthEnd = `${y}-${String(m + 1).padStart(2, '0')}-${String(lastDay).padStart(2, '0')}`;
        return !(n.endDate < monthStart || n.startDate > monthEnd);
      }
    }

    function renderNotices() {
      const container = document.getElementById('notice-list-container');
      const printList = document.getElementById('print-notice-list');
      if (!container) return;

      container.innerHTML = '';
      if (printList) printList.innerHTML = '';

      const visibleNotices = notices.filter(isNoticeVisibleForCurrentView);

      if (visibleNotices.length === 0) {
        const msg = showAllNotices ? "등록된 전체 공지사항이 없습니다." : "현재 조회 기간에 해당하는 공지사항이 없습니다.";
        container.innerHTML = `<p class="text-xs text-amber-800/60 italic py-1">${msg}</p>`;
        if (printList) printList.innerHTML = `<div>공지사항 없음</div>`;
        return;
      }

      visibleNotices.forEach(n => {
        const item = document.createElement('div');
        item.className = "flex items-start justify-between gap-2 py-1 text-xs border-b border-amber-200/40 last:border-0";
        item.innerHTML = `
          <div class="flex items-start space-x-2 flex-1">
            <span class="text-[10px] font-bold bg-amber-200/90 text-amber-900 px-1.5 py-0.5 rounded shrink-0">${n.author || '공지'}</span>
            <span class="text-slate-800 font-medium leading-relaxed">${n.content}</span>
            <span class="text-[10px] text-amber-900/50 shrink-0 self-center">(${n.startDate} ~ ${n.endDate})</span>
          </div>
          <button type="button" onclick="deleteNotice('${n.id}')" title="공지 삭제" class="cursor-pointer text-amber-800/40 hover:text-rose-600 px-1 font-bold text-xs shrink-0">
            <i class="fa-solid fa-xmark"></i>
          </button>
        `;
        container.appendChild(item);

        if (printList) {
          const pItem = document.createElement('div');
          pItem.innerHTML = `• <b>[${n.author}]</b> ${n.content} <span class="text-gray-500">(${n.startDate} ~ ${n.endDate})</span>`;
          printList.appendChild(pItem);
        }
      });
    }

    function openNoticeModal() {
      document.getElementById('notice-form').reset();
      document.getElementById('notice-author-input').value = "원무실";
      
      const y = currentCalMonth.getFullYear();
      const m = currentCalMonth.getMonth();
      const firstStr = `${y}-${String(m + 1).padStart(2, '0')}-01`;
      const lastDay = new Date(y, m + 1, 0).getDate();
      const lastStr = `${y}-${String(m + 1).padStart(2, '0')}-${String(lastDay).padStart(2, '0')}`;

      document.getElementById('notice-start-date').value = firstStr;
      document.getElementById('notice-end-date').value = lastStr;

      document.getElementById('notice-modal').classList.remove('hidden');
    }

    function closeNoticeModal() {
      document.getElementById('notice-modal').classList.add('hidden');
    }

    function saveNotice(e) {
      e.preventDefault();
      const author = document.getElementById('notice-author-input').value.trim() || '원무실';
      const content = document.getElementById('notice-content-input').value.trim();
      const startDate = document.getElementById('notice-start-date').value;
      const endDate = document.getElementById('notice-end-date').value;

      if (!content || !startDate || !endDate) return;

      if (startDate > endDate) {
        alert('게시 종료일은 시작일보다 이후여야 합니다.');
        return;
      }

      const newNotice = {
        id: "n_" + Date.now(),
        author: author,
        content: content,
        startDate: startDate,
        endDate: endDate
      };

      notices.unshift(newNotice);
      try {
        localStorage.setItem('kg_notices_list_v2', JSON.stringify(notices));
      } catch(e) {}

      renderNotices();
      closeNoticeModal();
    }

    function deleteNotice(id) {
      if (confirm('이 공지사항을 삭제하시겠습니까?')) {
        notices = notices.filter(n => n.id !== id);
        try {
          localStorage.setItem('kg_notices_list_v2', JSON.stringify(notices));
        } catch(e) {}
        renderNotices();
      }
    }

    function switchTab(tab) {
      currentTab = tab;
      const btnWeekly = document.getElementById('tab-btn-weekly');
      const btnMonthly = document.getElementById('tab-btn-monthly');
      const viewWeekly = document.getElementById('view-weekly');
      const viewMonthly = document.getElementById('view-monthly');

      if (!btnWeekly || !btnMonthly || !viewWeekly || !viewMonthly) return;

      if (tab === 'weekly') {
        btnWeekly.className = 'cursor-pointer px-4 py-1.5 text-xs font-semibold rounded-md transition-all bg-indigo-600 text-white shadow';
        btnMonthly.className = 'cursor-pointer px-4 py-1.5 text-xs font-semibold rounded-md transition-all text-indigo-200 hover:text-white';
        viewWeekly.classList.remove('hidden');
        viewMonthly.classList.add('hidden');
      } else {
        btnMonthly.className = 'cursor-pointer px-4 py-1.5 text-xs font-semibold rounded-md transition-all bg-indigo-600 text-white shadow';
        btnWeekly.className = 'cursor-pointer px-4 py-1.5 text-xs font-semibold rounded-md transition-all text-indigo-200 hover:text-white';
        viewMonthly.classList.remove('hidden');
        viewWeekly.classList.add('hidden');
      }
      renderCurrentView();
    }

    function navigateDate(dir) {
      if (currentTab === 'weekly') {
        currentMonday.setDate(currentMonday.getDate() + (dir * 7));
      } else {
        currentCalMonth.setMonth(currentCalMonth.getMonth() + dir);
      }
      renderCurrentView();
    }

    function renderCurrentView() {
      const targetFilter = document.getElementById('filter-target').value;
      const catFilter = document.getElementById('filter-category').value;

      const filtered = schedules.filter(item => {
        const matchTarget = (targetFilter === 'ALL' || item.target === targetFilter);
        const matchCat = (catFilter === 'ALL' || item.category === catFilter);
        return matchTarget && matchCat;
      });

      renderNotices();

      if (currentTab === 'weekly') {
        renderWeeklyTable(filtered);
      } else {
        renderMonthlyView(filtered);
      }
    }

    // 1. 주간 테이블 출력
    function renderWeeklyTable(items) {
      const days = [];
      const dayNames = ['월', '화', '수', '목', '금'];
      const todayStr = formatDate(new Date());

      for (let i = 0; i < 5; i++) {
        const d = new Date(currentMonday);
        d.setDate(currentMonday.getDate() + i);
        days.push(d);
        const th = document.getElementById(`th-day-${i + 1}`);
        if (th) {
          const isToday = (formatDate(d) === todayStr);
          th.className = `py-2 px-2 border-r w-1/5 ${isToday ? 'bg-indigo-50 text-indigo-900 font-black' : ''}`;
          th.innerHTML = `${dayNames[i]}${isToday ? ' <span class="no-print text-[10px] bg-indigo-600 text-white px-1 rounded">오늘</span>' : ''}<br><span class="font-normal text-[11px] text-slate-500">${d.getMonth() + 1}/${d.getDate()}</span>`;
        }
      }

      const startStr = `${currentMonday.getFullYear()}.${currentMonday.getMonth() + 1}.${currentMonday.getDate()}`;
      const endD = days[4];
      const endStr = `${endD.getMonth() + 1}.${endD.getDate()}`;
      document.getElementById('current-range-label').textContent = `${startStr} ~ ${endStr}`;
      document.getElementById('print-title').textContent = `${currentMonday.getFullYear()}학년도 주간 교육활동 계획 (${startStr} ~ ${endStr})`;
      document.getElementById('print-date').textContent = `출력일시: ${formatDate(new Date())}`;

      const tbody = document.getElementById('weekly-tbody');
      tbody.innerHTML = '';

      CATEGORIES.forEach(cat => {
        const tr = document.createElement('tr');
        tr.className = 'hover:bg-slate-50/50';

        let html = `<td class="py-2.5 px-2 font-bold bg-slate-50 text-slate-700 text-center border-r select-none">${cat}</td>`;

        for (let i = 0; i < 5; i++) {
          const dateStr = formatDate(days[i]);
          const dayItems = items.filter(it => it.date === dateStr && it.category === cat);
          const isToday = (dateStr === todayStr);

          html += `
            <td onclick="openCreateModalWithDateAndCat('${dateStr}', '${cat}')" 
                title="${dateStr} [${cat}] 클릭하여 새 일정 등록"
                class="cursor-pointer py-1.5 px-2 border-r align-top space-y-1 min-h-[55px] ${isToday ? 'bg-indigo-50/20' : ''} hover:bg-indigo-50/60 transition-colors relative group">
          `;

          if (dayItems.length === 0) {
            html += `
              <div class="h-10 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity text-slate-400 text-xs no-print">
                <i class="fa-solid fa-plus text-indigo-400"></i>
              </div>
            `;
          }

          dayItems.forEach(it => {
            html += `
              <div onclick="event.stopPropagation(); openEditModal('${it.id}')" 
                   title="클릭하여 수정"
                   class="cursor-pointer bg-indigo-50/90 hover:bg-indigo-100/90 border border-indigo-200 hover:border-indigo-300 rounded p-1.5 shadow-xs relative transition-colors">
                <button type="button" onclick="event.stopPropagation(); deleteSchedule('${it.id}')" title="삭제" class="no-print absolute top-1 right-1 text-slate-400 hover:text-rose-600 px-1 font-bold text-xs cursor-pointer">
                  <i class="fa-solid fa-xmark"></i>
                </button>
                <div class="flex items-center space-x-1 text-[10px] text-indigo-700 font-bold mb-0.5 pr-4">
                  <span class="bg-indigo-200/80 px-1 rounded">${it.target}</span>
                  <span class="text-slate-500 font-normal">${it.owner || ''}</span>
                </div>
                <div class="font-bold text-slate-800 text-xs">${it.title}</div>
                ${it.desc ? `<div class="text-[11px] text-slate-600 mt-0.5 leading-tight whitespace-pre-wrap">${it.desc}</div>` : ''}
              </div>
            `;
          });
          html += `</td>`;
        }
        tr.innerHTML = html;
        tbody.appendChild(tr);
      });
    }

    // 2. 월간 달력 및 전체 목록 출력
    function renderMonthlyView(items) {
      const year = currentCalMonth.getFullYear();
      const month = currentCalMonth.getMonth();
      const todayStr = formatDate(new Date());

      document.getElementById('current-range-label').textContent = `${year}년 ${month + 1}월`;
      document.getElementById('print-title').textContent = `${year}학년도 ${month + 1}월 유치원 교육계획안 (월간 달력)`;
      document.getElementById('print-date').textContent = `출력일시: ${formatDate(new Date())}`;
      const printSub = document.getElementById('print-sub-title');
      if (printSub) printSub.textContent = `${year}학년도 ${month + 1}월 세부 학사일정 및 업무 협조 목록`;

      const firstDay = new Date(year, month, 1).getDay();
      const lastDate = new Date(year, month + 1, 0).getDate();

      const grid = document.getElementById('calendar-grid');
      grid.innerHTML = '';

      for (let i = 0; i < firstDay; i++) {
        const empty = document.createElement('div');
        empty.className = 'bg-slate-50/60 min-h-[80px] cal-cell p-1.5 text-slate-300 text-xs';
        grid.appendChild(empty);
      }

      for (let day = 1; day <= lastDate; day++) {
        const currentDateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const dayOfWeek = (firstDay + day - 1) % 7;
        const isSun = (dayOfWeek === 0);
        const isSat = (dayOfWeek === 6);
        const isToday = (currentDateStr === todayStr);

        const dayItems = items.filter(it => it.date === currentDateStr);

        const cell = document.createElement('div');
        cell.className = `min-h-[80px] cal-cell p-1.5 flex flex-col justify-between ${isToday ? 'bg-indigo-50/40 ring-1 ring-indigo-400' : 'bg-white'}`;

        let dateClass = "font-bold text-xs";
        if (isSun) dateClass += " text-rose-500";
        else if (isSat) dateClass += " text-blue-500";
        else dateClass += " text-slate-700";

        let schedulesHtml = dayItems.map(it => `
          <div onclick="openEditModal('${it.id}')" class="cursor-pointer bg-indigo-50 hover:bg-indigo-100 border border-indigo-200 rounded px-1.5 py-0.5 text-[11px] flex items-center justify-between transition-colors">
            <span class="truncate font-semibold text-slate-800" title="${it.title}">[${it.category}] ${it.title}</span>
            <button type="button" onclick="event.stopPropagation(); deleteSchedule('${it.id}')" title="삭제" class="no-print ml-1 text-slate-400 hover:text-rose-600 font-bold cursor-pointer">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>
        `).join('');

        cell.innerHTML = `
          <div>
            <div class="flex justify-between items-center mb-1">
              <span class="${dateClass}">
                ${day}
                ${isToday ? '<span class="no-print ml-1 text-[9px] bg-indigo-600 text-white px-1 py-0.2 rounded font-normal">오늘</span>' : ''}
              </span>
              <button type="button" onclick="openCreateModalWithDate('${currentDateStr}')" title="이 날짜에 추가" class="no-print text-[10px] text-slate-300 hover:text-indigo-600 cursor-pointer">
                <i class="fa-solid fa-plus"></i>
              </button>
            </div>
            <div class="space-y-1">
              ${schedulesHtml}
            </div>
          </div>
        `;
        grid.appendChild(cell);
      }

      // 하단 세부 목록
      const monthPrefix = `${year}-${String(month + 1).padStart(2, '0')}`;
      const thisMonthItems = items.filter(it => it.date.startsWith(monthPrefix));
      const tbody = document.getElementById('monthly-tbody');
      tbody.innerHTML = '';
      document.getElementById('total-count-label').textContent = `총 ${thisMonthItems.length}건`;

      const sorted = [...thisMonthItems].sort((a, b) => new Date(a.date) - new Date(b.date));

      if (sorted.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center py-6 text-slate-400">이번 달 등록된 일정이 없습니다.</td></tr>`;
        return;
      }

      sorted.forEach(it => {
        const tr = document.createElement('tr');
        tr.className = 'hover:bg-slate-50';
        tr.innerHTML = `
          <td class="py-2 px-3 border-r text-center font-medium text-slate-600">${it.date}</td>
          <td class="py-2 px-3 border-r text-center"><span class="bg-slate-100 text-slate-700 px-1.5 py-0.5 rounded font-semibold text-[11px]">${it.target}</span></td>
          <td class="py-2 px-3 border-r text-center"><span class="bg-indigo-50 text-indigo-700 px-1.5 py-0.5 rounded font-semibold text-[11px]">${it.category}</span></td>
          <td class="py-2 px-3 border-r cursor-pointer hover:text-indigo-600" onclick="openEditModal('${it.id}')" title="클릭하여 수정">
            <span class="font-bold text-slate-800 hover:underline">${it.title}</span>
            ${it.desc ? `<p class="text-slate-500 text-[11px] mt-0.5 whitespace-pre-wrap">${it.desc}</p>` : ''}
          </td>
          <td class="py-2 px-3 border-r text-center text-slate-600">${it.owner || '-'}</td>
          <td class="py-2 px-3 text-center no-print">
            <button type="button" onclick="deleteSchedule('${it.id}')" class="cursor-pointer text-rose-500 hover:text-rose-700 font-bold p-1" title="삭제">
              <i class="fa-regular fa-trash-can"></i>
            </button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function openCreateModal() {
      const form = document.getElementById('schedule-form');
      if (form) form.reset();
      document.getElementById('form-edit-id').value = "";
      
      const defaultDate = formatDate(new Date());
      document.getElementById('form-date').value = defaultDate;
      document.getElementById('form-target').value = "전원";
      document.getElementById('form-category').value = "교육활동";

      document.getElementById('modal-title').innerHTML = `<i class="fa-solid fa-calendar-plus mr-2 text-yellow-300"></i>새 일정 등록`;
      document.getElementById('modal-header-bg').className = "bg-indigo-900 px-5 py-3.5 flex justify-between items-center text-white";
      document.getElementById('btn-modal-submit').textContent = "저장하기";
      document.getElementById('btn-modal-submit').className = "cursor-pointer px-4 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-md shadow";
      document.getElementById('btn-modal-delete').classList.add('hidden');

      document.getElementById('schedule-modal').classList.remove('hidden');
    }

    function openCreateModalWithDate(dateStr) {
      openCreateModal();
      document.getElementById('form-date').value = dateStr;
    }

    function openCreateModalWithDateAndCat(dateStr, categoryStr) {
      openCreateModal();
      document.getElementById('form-date').value = dateStr;
      if (categoryStr && CATEGORIES.includes(categoryStr)) {
        document.getElementById('form-category').value = categoryStr;
      }
    }

    function openEditModal(id) {
      const item = schedules.find(it => it.id === id);
      if (!item) return;

      document.getElementById('schedule-form').reset();
      document.getElementById('form-edit-id').value = item.id;
      document.getElementById('form-date').value = item.date;
      document.getElementById('form-target').value = item.target || "전원";
      document.getElementById('form-category').value = (item.category === '교육행사' ? '교육활동' : item.category) || "교육활동";
      document.getElementById('form-owner').value = item.owner || "";
      document.getElementById('form-title').value = item.title || "";
      document.getElementById('form-desc').value = item.desc || "";

      document.getElementById('modal-title').innerHTML = `<i class="fa-solid fa-pen-to-square mr-2 text-yellow-300"></i>일정 상세 및 수정`;
      document.getElementById('modal-header-bg').className = "bg-slate-800 px-5 py-3.5 flex justify-between items-center text-white";
      document.getElementById('btn-modal-submit').textContent = "수정 완료";
      document.getElementById('btn-modal-submit').className = "cursor-pointer px-4 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-md shadow";
      document.getElementById('btn-modal-delete').classList.remove('hidden');

      document.getElementById('schedule-modal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('schedule-modal').classList.add('hidden');
    }

    function handleScheduleFormSubmit(e) {
      e.preventDefault();
      const editId = document.getElementById('form-edit-id').value;
      const inputDateStr = document.getElementById('form-date').value;
      if (!inputDateStr) return;

      const titleVal = document.getElementById('form-title').value.trim();
      const targetVal = document.getElementById('form-target').value;
      const categoryVal = document.getElementById('form-category').value;
      const ownerVal = document.getElementById('form-owner').value.trim();
      const descVal = document.getElementById('form-desc').value.trim();

      if (editId) {
        const idx = schedules.findIndex(it => it.id === editId);
        if (idx !== -1) {
          schedules[idx] = {
            ...schedules[idx],
            date: inputDateStr,
            target: targetVal,
            category: categoryVal,
            owner: ownerVal,
            title: titleVal,
            desc: descVal
          };
          alert(`[${titleVal}] 일정이 성공적으로 수정되었습니다.`);
        }
      } else {
        const newEntry = {
          id: Date.now().toString(),
          date: inputDateStr,
          target: targetVal,
          category: categoryVal,
          owner: ownerVal,
          title: titleVal,
          desc: descVal
        };
        schedules.push(newEntry);
        alert(`[${newEntry.title}] 일정이 새로 등록되었습니다.`);
      }

      const selectedDate = new Date(inputDateStr + 'T00:00:00');
      currentMonday = getMonday(selectedDate);
      currentCalMonth = new Date(selectedDate.getFullYear(), selectedDate.getMonth(), 1);

      saveToStorage();
      closeModal();
    }

    function handleModalDelete() {
      const editId = document.getElementById('form-edit-id').value;
      if (!editId) return;
      deleteSchedule(editId);
      closeModal();
    }

    function deleteSchedule(id) {
      const targetItem = schedules.find(it => it.id === id);
      const title = targetItem ? `[${targetItem.title}]` : '선택한';

      if (confirm(`${title} 일정을 삭제하시겠습니까?`)) {
        schedules = schedules.filter(it => it.id !== id);
        saveToStorage();
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderCurrentView();
    });
  </script>
</body>
</html>
